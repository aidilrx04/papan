<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link
    rel="icon"
    type="image/png"
    href="/icons/favicon-16x16"
  />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>PapanJer</title>
  <meta
    name="description"
    content="A lazy budget app that I built for myself"
  >
  <meta
    name="keywords"
    content="webapp, budget tracker"
  >
  <link
    rel="manifest"
    href="manifest.json"
  >
  <link
    rel="apple-touch-icon"
    href="icons/apple-touch-icon.png"
  >

  <!-- Makes the app run in full-screen mode on iOS -->
  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <!-- Sets the status bar color (default, black, or black-translucent) -->
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <!-- Sets the App Title for the iOS home screen -->
  <meta
    name="apple-mobile-web-app-title"
    content="PaPanJer"
  >
</head>

<body>
  <div id="app"></div>
  <script
    type="module"
    src="/src/main.ts"
  ></script>
</body>

</html>
